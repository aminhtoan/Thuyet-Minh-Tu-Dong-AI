server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 201m;
    location = /local-ready { access_log off; return 200 'ok'; }
    location = /api { return 308 /api/; }
    location ^~ /maintenance { return 404; }
    location ^~ /api/maintenance { return 404; }
    location ^~ /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        # API failures remain API failures; never rewrite them to index.html.
        proxy_intercept_errors off;
    }
    location / { try_files $uri $uri/ /index.html; }
}
