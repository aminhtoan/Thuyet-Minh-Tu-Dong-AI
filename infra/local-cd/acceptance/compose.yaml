name: narration-s424-acceptance
services:
  mongodb:
    image: ${S424_MONGO_IMAGE:?Use the acceptance image map}
    command: [mongod, --replSet, s424rs, --bind_ip_all, --setParameter, diagnosticDataCollectionEnabled=false]
    labels: {acceptance.scope: S424, acceptance.run: '${S424_RUN_ID:?Run ID required}'}
    volumes:
      - database:/data/db
      - ./mongo-init.js:/opt/s424/mongo-init.js:ro
    tmpfs: [/data/configdb]
    networks: [isolated]
    healthcheck:
      test: [CMD, mongosh, --quiet, --file, /opt/s424/mongo-init.js]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 20
  backend:
    image: ${S424_BACKEND_IMAGE:?Use the acceptance image map}
    init: true
    labels: {acceptance.scope: S424, acceptance.run: '${S424_RUN_ID:?Run ID required}'}
    environment:
      NODE_ENV: production
      PORT: '8080'
      UPLOAD_DIR: /data/uploads
      MONGODB_URI: mongodb://mongodb:27017/s424_acceptance?replicaSet=s424rs
      JWT_ACCESS_SECRET: s424-synthetic-access-not-for-production
      JWT_REFRESH_SECRET: s424-synthetic-refresh-not-for-production
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 1d
      CORS_ORIGINS: http://127.0.0.1:5280,http://127.0.0.1:5281
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
      OPENAI_API_KEY: ''
      CUSTOMER_TRANSLATION_ENABLED: 'false'
      GROUP_TRANSLATION_ENABLED: 'false'
    volumes: [media:/data/uploads]
    networks: [isolated]
    depends_on:
      mongodb: {condition: service_healthy}
    stop_grace_period: 2m
  customer-web:
    image: ${S424_CUSTOMER_IMAGE:?Use the acceptance image map}
    labels: {acceptance.scope: S424, acceptance.run: '${S424_RUN_ID:?Run ID required}'}
    ports: ['127.0.0.1:5280:8080']
    networks: [isolated, frontend]
    depends_on:
      backend: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
  admin-web:
    image: ${S424_ADMIN_IMAGE:?Use the acceptance image map}
    labels: {acceptance.scope: S424, acceptance.run: '${S424_RUN_ID:?Run ID required}'}
    ports: ['127.0.0.1:5281:8080']
    networks: [isolated, frontend]
    depends_on:
      backend: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
networks:
  isolated:
    name: narration-s424-acceptance-isolated
    internal: true
    driver: bridge
    labels: {acceptance.scope: S424, acceptance.run: '${S424_RUN_ID:?Run ID required}'}
  frontend:
    name: narration-s424-acceptance-frontend
    driver: bridge
    labels: {acceptance.scope: S424, acceptance.run: '${S424_RUN_ID:?Run ID required}'}
volumes:
  database:
    name: narration-s424-acceptance-database
    labels: {acceptance.scope: S424, acceptance.run: '${S424_RUN_ID:?Run ID required}'}
  media:
    name: narration-s424-acceptance-media
    labels: {acceptance.scope: S424, acceptance.run: '${S424_RUN_ID:?Run ID required}'}
