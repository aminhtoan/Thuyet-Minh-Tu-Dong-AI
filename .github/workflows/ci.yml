name: CI V1

on:
  pull_request:
    branches: [main]
  push:
    branches: [ci/first-run]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Synthetic configuration only. No repository/environment secrets are consumed.
env:
  CI: 'true'
  npm_config_update_notifier: 'false'
  MONGODB_URI: mongodb://127.0.0.1:1/ci_mock_only
  JWT_ACCESS_SECRET: ci-only-access-placeholder-not-a-real-secret
  JWT_REFRESH_SECRET: ci-only-refresh-placeholder-not-a-real-secret
  JWT_ACCESS_EXPIRES_IN: 15m
  JWT_REFRESH_EXPIRES_IN: 1d
  GEMINI_API_KEY: ''
  GOOGLE_API_KEY: ''
  OPENAI_API_KEY: ''
  EXPO_NO_DOTENV: '1'
  EXPO_OFFLINE: '1'
  EXPO_NO_TELEMETRY: '1'
  VITE_API_BASE_URL: https://ci-api.example.invalid/api
  EXPO_PUBLIC_API_BASE_URL: https://ci-api.example.invalid/api

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: Backend (mock allowlist only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Verify test network guard
        run: node ../.github/ci/network-guard.test.mjs
      - name: Run four mock test files (no default npm test)
        run: node ../.github/ci/run-tests.mjs backend

  customer-web:
    name: Customer Web (one documented media test excluded)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Tests with explicit missing-video exclusion and coverage summary
        run: node ../.github/ci/run-tests.mjs customer-web

  admin-web:
    name: Admin Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Test (network guard inherited by npm and Node tests)
        env:
          CI_NETWORK_GUARD: '1'
          NODE_OPTIONS: --import=${{ github.workspace }}/.github/ci/network-guard.mjs
        run: npm test
      - run: npm run build

  customer-mobile:
    name: Customer Mobile (Node tests, no native build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend-mobile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend-mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Test (no emulator, APK, AAB, EAS or inference)
        env:
          CI_NETWORK_GUARD: '1'
          NODE_OPTIONS: --import=${{ github.workspace }}/.github/ci/network-guard.mjs
        run: npm test
